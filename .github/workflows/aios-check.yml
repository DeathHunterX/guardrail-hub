name: AIOS Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  aios-check:
    name: AIOS Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run AIOS regression tests
        run: python -m unittest discover -s .ai/tools/tests -p "test_*.py" -v

      - name: Run AIOS gate
        run: python .ai/tools/aios.py check
