name: guardrail-hub

services:
  mcp-server:
    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile
    image: guardrail-mcp-server:local
    container_name: guardrail-mcp-server
    env_file:
      - path: ./.env
        required: false
    environment:
      PATH: "/app/.venv/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      MCP_SERVER_PORT: "${MCP_SERVER_PORT:-8787}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://guardrail:guardrail@postgres:5432/guardrail_hub}"
      DYNAMODB_ENDPOINT_URL: "${DYNAMODB_ENDPOINT_URL:-}"
      AWS_REGION: "${AWS_REGION:-ap-southeast-1}"
    ports:
      - "${MCP_SERVER_PORT:-8787}:${MCP_SERVER_PORT:-8787}"
    volumes:
      - ./app:/app/app
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./public:/app/public
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import os, urllib.request; port=os.getenv('MCP_SERVER_PORT', '8787'); urllib.request.urlopen(f'http://127.0.0.1:{port}/health/live', timeout=5).read()"
      interval: 300s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16-alpine
    container_name: guardrail-postgres
    profiles:
      - postgres
      - local-db
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-guardrail_hub}"
      POSTGRES_USER: "${POSTGRES_USER:-guardrail}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-guardrail}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER:-guardrail}" -d "$${POSTGRES_DB:-guardrail_hub}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  zap:
    build:
      context: .
      dockerfile: docker/owasp_zap/Dockerfile
    # No container_name: fixing a name blocks `docker compose up --scale
    # zap=N` (every replica would collide on it). Each replica gets Docker's
    # own generated name/hostname and self-registers via that — see
    # docker/owasp_zap/register-worker.sh.
    profiles:
      - zap
    depends_on:
      mcp-server:
        condition: service_started
    environment:
      # Consumed by register-worker.sh (the entrypoint's sidecar), not by ZAP
      # itself. There is no worker name/prefix/index here — see that script.
      MCP_SERVER_INTERNAL_URL: "http://mcp-server:${MCP_SERVER_PORT:-8787}"
      ZAP_API_PORT: "8080"
      ZAP_API_KEY: "${OWASP_ZAP_API_KEY:-change-this-zap-key}"
      ZAP_WORKER_HEARTBEAT_INTERVAL_SECONDS: "${ZAP_WORKER_HEARTBEAT_INTERVAL_SECONDS:-20}"
      ZAP_READY_STABLE_SUCCESS_COUNT: "${ZAP_READY_STABLE_SUCCESS_COUNT:-3}"
    command:
      - zap.sh
      - -addonuninstall
      - insights
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.key=${OWASP_ZAP_API_KEY:-change-this-zap-key}
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
      - -config
      - connection.timeoutInSecs=60
      - -config
      - api.debug=true
      - -config
      - network.http.maxHeaderSize=102400
      - -config
      - http.useragent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
    expose:
      - "8080"
      - "8090"
    volumes:
      # Anonymous (not host-path) volumes: with `--scale zap=N`, every
      # replica needs its own working/report directory. A shared host-path
      # bind mount here would have every replica writing to the same files.
      - /zap/wrk
      - /zap/reports
    restart: unless-stopped
    networks:
      - app-network
      - shared-network

  jmeter:
    build:
      context: .
      dockerfile: docker/jmeter/Dockerfile
    # JMeter version and JVM heap are hard-pinned inside the image
    # (docker/jmeter/Dockerfile) and intentionally NOT overridable here, so
    # every run uses the exact same engine and heap.
    profiles:
      - jmeter
    # No `restart`: unlike zap (a daemon), `jmeter -n` runs one test plan to
    # completion and exits. This is a CLI tool run as
    # `docker compose --profile jmeter run --rm jmeter <jmeter-args>`; `up`
    # without an override runs the bundled smoke-test plan below.
    command:
      - -n
      - -t
      - /jmeter/test-plans/smoke-test.jmx
      - -l
      - /jmeter/reports/smoke-test.jtl
      - -j
      - /jmeter/logs/jmeter.log
    volumes:
      # Test plans are versioned source, mounted read-only; everything else
      # is runtime output and stays writable.
      - ./docker/jmeter/test-plans:/jmeter/test-plans:ro
      - ./reports/jmeter:/jmeter/reports
      - ./logs/jmeter:/jmeter/logs
      - ./data/jmeter/tmp:/jmeter/tmp
      - ./data/jmeter/artifacts:/jmeter/artifacts
    networks:
      - app-network

  jmeter-worker:
    build:
      context: .
      dockerfile: docker/jmeter/worker.Dockerfile
    # No container_name: fixing a name blocks `docker compose up --scale
    # jmeter-worker=N` (replicas would collide on it). Each replica gets its own
    # generated HOSTNAME and self-registers via that — the warm pull-model worker
    # (ADR-0010 §4.2), the JMeter analogue of the `zap` worker above.
    profiles:
      - jmeter-worker
    depends_on:
      mcp-server:
        condition: service_started
    environment:
      # The worker's own config surface (read by app/workers/performance_worker.py,
      # not the server Settings). No worker name/prefix/index — worker_id defaults
      # to this replica's HOSTNAME.
      MCP_SERVER_INTERNAL_URL: "http://mcp-server:${MCP_SERVER_PORT:-8787}"
      PERFORMANCE_WORKER_TOKEN: "${PERFORMANCE_WORKER_TOKEN:-change-this-performance-worker-token}"
      PERFORMANCE_WORKER_HEARTBEAT_INTERVAL_SECONDS: "${PERFORMANCE_WORKER_HEARTBEAT_INTERVAL_SECONDS:-5}"
      PERFORMANCE_WORKER_WORKSPACE_DIR: "/jmeter/workspaces"
    volumes:
      # Anonymous (not host-path) volume: with `--scale jmeter-worker=N`, every
      # replica needs its own workspace root. A shared bind mount would have all
      # replicas writing to the same per-operation trees.
      - /jmeter/workspaces
    restart: unless-stopped
    networks:
      - app-network
      - shared-network

networks:
  app-network:
    driver: bridge

  shared-network:
    external: true
    name: guardrail-shared

volumes:
  postgres-data:
