# =============================================================================
# Provider Registry — Phase 2 placeholder
# =============================================================================
#
# This file is intentionally EMPTY in Phase 2. The registry runtime loads
# this file at startup; an empty file produces an empty provider set, which
# is the correct state for Phase 2 (no provider implementations exist yet).
#
# Schema (Phase 3+ will populate this):
#
#   providers:
#     - provider_id: ollama-local              # required, unique
#       provider_type: ollama                  # required, enum
#       deployment: self_hosted               # required, enum
#       enabled: true                          # optional, default: true
#       priority: 100                          # optional, default: 100, [0, 100]
#       capabilities:                          # optional, list of Capability
#         - chat
#         - embedding
#       connection:                            # required, dict
#         base_url: http://localhost:11434
#         timeout_seconds: 60.0
#         max_retries: 3
#       auth:                                  # optional, dict
#         api_key_env: OLLAMA_API_KEY          # references an env var
#       metadata:                              # optional, dict (free form)
#         region: us-east-1
#
# Reference: Decision 0014 §3, .ai/standards/architecture/provider-registry.md,
#            .ai/playbooks/intelligence/add-provider.md
#
providers: []